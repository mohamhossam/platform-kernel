name: Release

# A tag is published only after every CI gate passes on the tagged commit, and
# only when the tag matches the version the package declares.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the declared version
        run: |
          declared="v$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          test "$declared" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $declared"; exit 1; }
          grep -q "__version__ = \"${declared#v}\"" src/smb_kernel/__init__.py

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
