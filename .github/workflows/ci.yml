name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: kernel
          POSTGRES_PASSWORD: kernel
          POSTGRES_DB: kernel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kernel -d kernel_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://kernel:kernel@localhost:5432/kernel_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked project
        run: |
          uv sync --locked --extra dev --extra tracing
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: pytest with coverage
        run: pytest --cov --cov-report=term

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src tests

      - name: lint-imports
        run: lint-imports
